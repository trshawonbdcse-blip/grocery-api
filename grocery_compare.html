<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toote hind - Tark Ostukorv Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f3f4f6; padding: 20px; display: flex; justify-content: center; }
        
        .modal-card { background: #ffffff; width: 100%; max-width: 440px; border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .modal-title { font-size: 20px; font-weight: 800; color: #111827; }
        
        /* Store Comparison Cards */
        .store-card { border: 1px solid #e5e7eb; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; background: #ffffff; }
        .store-card.best { border-color: #10b981; background: #fafdfb; }
        
        .store-top { display: flex; justify-content: space-between; align-items: center; }
        .store-name { font-size: 16px; font-weight: 700; color: #1f2937; }
        .price-tag { font-size: 18px; font-weight: 800; color: #111827; }
        
        .badge { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; display: inline-block; margin-top: 2px; }
        .badge.green { color: #059669; }
        .badge.red { color: #dc2626; }

        .store-title { font-size: 12px; color: #6b7280; margin-top: 8px; display: flex; align-items: center; gap: 4px; }

        /* Item Meta Info */
        .info-section { margin-top: 20px; border-top: 1px solid #f3f4f6; padding-top: 16px; }
        .info-heading { font-size: 16px; font-weight: 800; margin-bottom: 8px; color: #111827; }
        .info-label { font-size: 12px; color: #6b7280; font-weight: 600; }
        .info-value { font-size: 14px; color: #1f2937; font-weight: 500; margin-bottom: 6px; }

        /* Bottom Sticky Action */
        .action-bar { display: flex; gap: 12px; margin-top: 20px; align-items: center; }
        .qty-picker { border: 1px solid #e5e7eb; border-radius: 30px; display: flex; align-items: center; padding: 6px 16px; gap: 12px; font-weight: 700; }
        .btn-add { flex: 1; background: #059669; color: #ffffff; border: none; padding: 14px; border-radius: 30px; font-weight: 700; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>

<div class="modal-card">
    <div class="modal-header">
        <div class="modal-title">Toote hind</div>
        <span style="font-size:20px; cursor:pointer;">✕</span>
    </div>

    <!-- Container for dynamic store comparison cards -->
    <div id="offersContainer">Loading product comparison...</div>

    <!-- Product EAN Info -->
    <div class="info-section">
        <div class="info-heading">Toote info</div>
        <div class="info-label">EAN</div>
        <div class="info-value" id="eanDisplay">-</div>
        <div class="info-label">Kirjeldus</div>
        <div class="info-value" id="descDisplay">-</div>
    </div>

    <!-- Add to Basket Control -->
    <div class="action-bar">
        <div class="qty-picker">
            <span>-</span>
            <span>1</span>
            <span>+</span>
        </div>
        <button class="btn-add">Lisa ostukorvi</button>
    </div>
</div>

<script>
    const API = "http://127.0.0.1:8000";
    
    // Example EAN for Eggo Large Eggs: 4740229011048
    async function loadProductComparison(ean = "4740229011048") {
        try {
            const res = await fetch(`${API}/api/groceries/compare/${ean}`);
            const data = await res.json();

            if (!data.success) {
                document.getElementById('offersContainer').innerHTML = `<div style="color:red;">${data.detail || 'Product not found.'}</div>`;
                return;
            }

            document.getElementById('eanDisplay').innerText = data.product_info.ean;
            document.getElementById('descDisplay').innerText = data.product_info.description;

            const offersHtml = data.store_offers.map(o => `
                <div class="store-card ${o.is_best_price ? 'best' : ''}">
                    <div class="store-top">
                        <div class="store-name">${o.store_name}</div>
                        <div style="text-align:right;">
                            <div class="price-tag">${o.price_formatted}</div>
                            <div class="badge ${o.badge_color}">
                                ${o.is_best_price ? '✔ ' : ''}${o.badge_label}
                            </div>
                        </div>
                    </div>
                    <div class="store-title">
                        🌐 ${o.title_on_store}
                    </div>
                </div>
            `).join('');

            document.getElementById('offersContainer').innerHTML = offersHtml;

        } catch (e) {
            console.error("Fetch Error:", e);
            document.getElementById('offersContainer').innerHTML = '<div style="color:red;">Error loading comparison data from server.</div>';
        }
    }

    window.onload = () => loadProductComparison("4740229011048");
</script>

</body>
</html>
