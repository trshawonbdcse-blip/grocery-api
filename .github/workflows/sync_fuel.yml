name: Daily Live Fuel Price Sync

on:
  schedule:
    # Runs every 6 hours at minute 0 (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync-fuel-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary httpx beautifulsoup4

      - name: Execute Fuel Price Ingestion Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python sync_fuel_prices.py
