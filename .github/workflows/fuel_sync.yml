name: Estonia Fuel Price Sync

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary beautifulsoup4 playwright

      - name: Install Playwright Chromium Browser
        run: |
          npx playwright install --with-deps chromium

      - name: Run Fuel Sync Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FUELO_KEY: ${{ secrets.FUELO_KEY }}
        run: python sync_estonia_fuel.py
