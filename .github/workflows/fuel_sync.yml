name: Estonia Fuel Prices Auto-Sync

on:
  schedule:
    # Runs every day at 04:00 UTC / 07:00 AM Tallinn Time
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary requests playwright
          playwright install chromium

      - name: Execute Fuel Ingestion Engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
        run: |
          python sync_estonia_fuel.py
