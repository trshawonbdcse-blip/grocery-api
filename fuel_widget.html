<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estonia Fuel Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6 min-h-screen">
    <div class="max-w-2xl mx-auto space-y-6">
        <header class="border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold text-sky-400">⛽ Tallinn Fuel Price Engine</h1>
            <p class="text-slate-400 text-sm">Find cheapest 95, 98, Diesel & LPG near you</p>
        </header>

        <!-- Controls -->
        <div class="bg-slate-800 p-4 rounded-xl space-y-4">
            <div>
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Fuel Type</label>
                <div class="grid grid-cols-4 gap-2" id="fuel-selector">
                    <button onclick="setFuel('95')" class="fuel-btn bg-sky-600 font-bold py-2 rounded-lg">95</button>
                    <button onclick="setFuel('98')" class="fuel-btn bg-slate-700 font-bold py-2 rounded-lg">98</button>
                    <button onclick="setFuel('Diesel')" class="fuel-btn bg-slate-700 font-bold py-2 rounded-lg">Diesel</button>
                    <button onclick="setFuel('LPG')" class="fuel-btn bg-slate-700 font-bold py-2 rounded-lg">LPG</button>
                </div>
            </div>

            <div>
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Search Radius</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setRadius(3.0)" class="radius-btn bg-sky-600 font-bold py-2 rounded-lg">3 km</button>
                    <button onclick="setRadius(5.0)" class="radius-btn bg-slate-700 font-bold py-2 rounded-lg">5 km</button>
                    <button onclick="setRadius(10.0)" class="radius-btn bg-slate-700 font-bold py-2 rounded-lg">10 km</button>
                </div>
            </div>
        </div>

        <!-- Best Option Highlight Card -->
        <div id="best-card" class="hidden bg-emerald-950 border border-emerald-500/30 p-5 rounded-2xl relative overflow-hidden">
            <span class="absolute top-3 right-3 bg-emerald-500 text-slate-950 font-black text-xs px-2.5 py-1 rounded-full uppercase">Best Option</span>
            <div id="best-content"></div>
        </div>

        <!-- Station Results List -->
        <div id="station-list" class="space-y-3"></div>
    </div>

    <script>
        let currentFuel = '95';
        let currentRadius = 3.0;
        let userLat = 59.4120;
        let userLng = 24.6750;

        // Auto-detect GPS location
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                userLat = pos.coords.latitude;
                userLng = pos.coords.longitude;
                fetchFuelData();
            }, () => fetchFuelData());
        } else {
            fetchFuelData();
        }

        function setFuel(fuel) {
            currentFuel = fuel;
            fetchFuelData();
        }

        function setRadius(radius) {
            currentRadius = radius;
            fetchFuelData();
        }

        async function fetchFuelData() {
            const res = await fetch(`/api/fuel/find-cheapest?lat=${userLat}&lng=${userLng}&fuel_type=${currentFuel}&radius_km=${currentRadius}`);
            const data = await res.json();

            if (!res.ok) {
                document.getElementById('best-card').classList.add('hidden');
                document.getElementById('station-list').innerHTML = `<p class="text-rose-400">${data.detail}</p>`;
                return;
            }

            // Render Best Option Card
            const best = data.best_option;
            document.getElementById('best-card').classList.remove('hidden');
            document.getElementById('best-content').innerHTML = `
                <div class="text-sm font-semibold text-emerald-400 uppercase">${best.chain_name}</div>
                <div class="text-xl font-bold">${best.station_name}</div>
                <div class="text-sm text-slate-300 mt-1">${best.address} (${best.distance_km} km away)</div>
                <div class="text-3xl font-black text-emerald-300 mt-2">€${best.price_per_liter.toFixed(3)} <span class="text-sm font-normal text-slate-400">/ liter</span></div>
            `;

            // Render Remaining Stations
            const listEl = document.getElementById('station-list');
            listEl.innerHTML = data.all_stations.slice(1).map(st => `
                <div class="bg-slate-800/60 p-4 rounded-xl flex justify-between items-center border border-slate-700/50">
                    <div>
                        <div class="font-bold">${st.station_name}</div>
                        <div class="text-xs text-slate-400">${st.address} • ${st.distance_km} km</div>
                    </div>
                    <div class="text-right">
                        <div class="text-lg font-bold text-sky-400">€${st.price_per_liter.toFixed(3)}</div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
