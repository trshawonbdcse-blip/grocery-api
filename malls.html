<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tallinn Malls & Clearance Deals</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #0f1015; color: #f3f4f6; padding: 20px; max-width: 1200px; margin: 0 auto; }
        
        .header { margin-bottom: 24px; border-bottom: 1px solid #27272a; padding-bottom: 16px; }
        .header h1 { font-size: 24px; color: #fbbf24; display: flex; align-items: center; gap: 8px; }
        .header p { color: #9ca3af; font-size: 14px; margin-top: 4px; }

        /* Radius Filter Bar */
        .radius-bar { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
        .radius-pill { background: #18181b; border: 1px solid #27272a; color: #9ca3af; font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .radius-pill.active { background: #d97706; border-color: #d97706; color: #ffffff; }

        /* Malls Horizontal Scroll */
        .mall-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 16px; margin-bottom: 20px; }
        .mall-card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 14px 18px; min-width: 160px; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
        .mall-card:hover { border-color: #f59e0b; }
        .mall-card.active { border-color: #d97706; background: #241a0d; }
        .mall-name { font-weight: 700; font-size: 15px; color: #ffffff; }
        .mall-distance { color: #f43f5e; font-size: 12px; margin-top: 4px; font-weight: 500; }

        /* Section Subheader */
        .section-header { margin: 20px 0 12px; color: #9ca3af; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Store Drawer List */
        .store-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
        .store-card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: all 0.2s; }
        .store-card:hover { border-color: #f59e0b; background: #202024; }
        .store-title { font-size: 16px; font-weight: 600; color: #ffffff; }
        .store-count { color: #10b981; font-size: 12px; margin-top: 4px; font-weight: 500; }

        /* Modal Overlay & Drawer */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); justify-content: flex-end; flex-direction: column; z-index: 1000; backdrop-filter: blur(4px); }
        .modal.open { display: flex; }
        .modal-content { background: #181920; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px; max-height: 85vh; overflow-y: auto; border-top: 1px solid #334155; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #27272a; padding-bottom: 12px; }
        .modal-header h3 { color: #ffffff; font-size: 20px; font-weight: 700; }
        .close-btn { cursor: pointer; font-size: 24px; color: #9ca3af; transition: color 0.2s; }
        .close-btn:hover { color: #ffffff; }

        /* Product Cards Grid inside Drawer */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
        .product-card { background: #222530; border: 1px solid #2d313e; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; }
        .product-img { width: 100%; height: 120px; object-fit: contain; margin: 8px 0; border-radius: 8px; background: #18181b; }
        .product-title { font-size: 13px; font-weight: 600; line-height: 1.4; color: #f3f4f6; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-prices { color: #10b981; font-weight: 700; margin-top: 10px; font-size: 15px; }
        .product-prices s { color: #6b7280; font-size: 12px; margin-left: 6px; font-weight: 400; }
        .btn-buy { background: #d97706; color: #ffffff; text-decoration: none; text-align: center; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 12px; margin-top: 12px; display: block; transition: background 0.2s; }
        .btn-buy:hover { background: #b45309; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛍️ Tallinn Malls & Clearance Deals</h1>
        <p>Live discounts and store outlets across Tallinn shopping malls</p>
    </div>

    <!-- Radius Range Selector -->
    <div class="radius-bar">
        <button class="radius-pill" onclick="changeRadius(3.0)">3 km</button>
        <button class="radius-pill active" onclick="changeRadius(5.0)">5 km</button>
        <button class="radius-pill" onclick="changeRadius(10.0)">10 km</button>
    </div>

    <!-- Horizontal Mall Selector -->
    <div class="mall-scroll" id="mallScroll">
        <div style="color: #9ca3af; padding: 10px;">Loading malls...</div>
    </div>

    <!-- Stores Header & List -->
    <div class="section-header" id="sectionHeader">Stores</div>
    <div class="store-list" id="storeList"></div>

    <!-- Products Drawer Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Deals</h3>
                <span class="close-btn" onclick="closeModal()">✕</span>
            </div>
            <div class="grid" id="productGrid"></div>
        </div>
    </div>

    <script>
        const API = "http://127.0.0.1:8000";
        let mallsData = [];

        async function loadData(radius = 5.0) {
            try {
                const res = await fetch(`${API}/api/outlets/by-radius?radius=${radius}`);
                const json = await res.json();
                
                if (json.data && json.data.length > 0) {
                    mallsData = json.data;
                    renderMalls(mallsData);
                    selectMall(mallsData[0].name);
                } else {
                    document.getElementById('mallScroll').innerHTML = '<div style="color:#9ca3af; padding:10px;">No malls found within radius.</div>';
                    document.getElementById('storeList').innerHTML = '';
                }
            } catch (err) {
                console.error("Failed to load malls:", err);
                document.getElementById('mallScroll').innerHTML = '<div style="color:#ef4444; padding:10px;">Error connecting to API server at localhost:8000.</div>';
            }
        }

        function renderMalls(malls) {
            document.getElementById('mallScroll').innerHTML = malls.map((m, i) => `
                <div class="mall-card ${i === 0 ? 'active' : ''}" onclick="selectMall('${m.name.replace(/'/g, "\\'")}')">
                    <div class="mall-name">${m.name}</div>
                    <div class="mall-distance">📍 ${m.distance_label || (m.distance_km ? m.distance_km + ' km' : 'Nearby')}</div>
                </div>
            `).join('');
        }

        function selectMall(name) {
            document.querySelectorAll('.mall-card').forEach(card => {
                const cardName = card.querySelector('.mall-name').innerText;
                card.classList.toggle('active', cardName === name);
            });

            const mall = mallsData.find(m => m.name === name);
            if (!mall) return;

            document.getElementById('sectionHeader').innerText = `${mall.name} Stores`;
            
            if (!mall.stores || mall.stores.length === 0) {
                document.getElementById('storeList').innerHTML = '<div style="color:#9ca3af; padding:10px;">No stores mapped for this mall.</div>';
                return;
            }

            document.getElementById('storeList').innerHTML = mall.stores.map(s => `
                <div class="store-card" onclick="openStore('${s.store_id}', '${s.store_name.replace(/'/g, "\\'")}')">
                    <div>
                        <div class="store-title">${s.store_name}</div>
                        <div class="store-count">🛍️ ${s.active_item_count || 0} Deals Available</div>
                    </div>
                    <span style="color:#9ca3af; font-size:18px;">❯</span>
                </div>
            `).join('');
        }

        async function openStore(id, name) {
            document.getElementById('modalTitle').innerText = name;
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '<div style="grid-column: 1 / -1; color:#9ca3af; text-align:center; padding:30px;">Loading active deals...</div>';
            document.getElementById('productModal').classList.add('open');

            try {
                const res = await fetch(`${API}/api/stores/${encodeURIComponent(id)}/products`);
                const json = await res.json();

                if (!json.products || json.products.length === 0) {
                    grid.innerHTML = '<div style="grid-column: 1 / -1; color:#9ca3af; text-align:center; padding:30px;">No active discount items extracted yet for this store.</div>';
                    return;
                }

                grid.innerHTML = json.products.map(p => `
                    <div class="product-card">
                        <img src="${p.image_url || 'https://via.placeholder.com/150?text=No+Image'}" class="product-img" onerror="this.src='https://via.placeholder.com/150?text=No+Image'" alt="${p.title}">
                        <div class="product-title">${p.title}</div>
                        <div class="product-prices">
                            €${p.discount_price.toFixed(2)} 
                            <s style="color:#6b7280;">€${p.regular_price.toFixed(2)}</s>
                        </div>
                        ${p.product_url ? `<a href="${p.product_url}" target="_blank" class="btn-buy">🛒 Open Store Web (.ee)</a>` : ''}
                    </div>
                `).join('');
            } catch (err) {
                console.error("Failed to load store products:", err);
                grid.innerHTML = '<div style="grid-column: 1 / -1; color:#ef4444; text-align:center; padding:30px;">Error connecting to API server.</div>';
            }
        }

        function closeModal() {
            document.getElementById('productModal').classList.remove('open');
        }

        function changeRadius(r) {
            document.querySelectorAll('.radius-pill').forEach(pill => {
                pill.classList.toggle('active', pill.innerText.includes(`${r} km`));
            });
            loadData(r); 
        }

        window.onload = () => loadData(5.0);
    </script>
</body>
</html>
